# Everything that can be checked without a game engine.
#
# Nothing in this file needs Unity, a Unity licence, a GPU or a Windows machine, so
# it runs on every push from the first commit onward. The Unity half of CI — the
# Windows IL2CPP player and the EditMode/PlayMode suites — lives in unity.yml and is
# gated off until a licence is configured. See docs/CI.md.
#
# Deliberately no `paths:` filters. It is tempting to run the audio audit only when
# Assets/Audio changes, but tools/audio/verify_audio.py parses
# Assets/Scripts/Core/GameConstants.cs to compare the Listener's clarity table
# against the measured clips (§04 × §12, finding F-002). A one-line edit to a core
# constant can therefore break the audio gate, and a filter would hide exactly that.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant — on a
# feature branch. On `main` it does not: cancelling leaves a commit that is already
# published and that CI never finished judging, and a cancelled run is grey, not red,
# so nobody goes looking. That is the same hole as a red push nobody noticed, which is
# the defect this file was last edited to close (a89cf64..43cf488, see docs/CI.md §0).
# Every commit on main therefore gets its own concurrency group and runs to the end.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # The runner's locale decides the language of dotnet's own output. Pinning it keeps
  # log greps and pasted failures readable for everyone reviewing a run.
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  # ───────────────────────────────────────────────────────────────────────────────
  # The gate that matters. Fast, no licence, covers every rule and tuned number.
  #
  # docs/ARCHITECTURE.md §1 puts the core sources inside the Unity project and
  # compiles them a second time through core/HorrorGame.Core.csproj, so this job
  # tests the exact files Unity ships. §5 says these are the tests that must always
  # be green.
  #
  # THIS JOB IS NOT ENFORCED BY ANYTHING. Nothing in a workflow file can stop a red
  # commit reaching main — that is repository configuration, and only the owner can
  # apply it. docs/CI.md §6 has the exact clicks, and the important caveat: a required
  # status check gates a *pull request*, and main's history is 100% direct pushes, so
  # the check must be paired with "require a pull request before merging" or it
  # protects nothing.
  # ───────────────────────────────────────────────────────────────────────────────
  core-tests:
    name: core tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # HorrorGame.Core.Tests targets net9.0; HorrorGame.Core targets
          # netstandard2.1 for Unity, which the 9.x SDK builds fine. Floating the
          # patch is intentional — a pinned patch rots into a download failure.
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('core/**/*.csproj', 'core/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The command from docs/ARCHITECTURE.md §5, plus a TRX so the next step can read
      # how many tests actually ran. Without the logger the only record of the run is
      # console text whose wording depends on DOTNET_CLI_UI_LANGUAGE; the TRX counters
      # are machine-readable and locale-independent.
      - name: dotnet test
        run: >
          dotnet test core/HorrorGame.Core.Tests/HorrorGame.Core.Tests.csproj
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory artifacts/test-results

      # MEASURED 2026-08-03 on this repo: `dotnet test` with a filter that matches
      # nothing prints "No test matches the given testcase filter" and EXITS 0. So a
      # suite that stops being discovered — a renamed namespace, an adapter that no
      # longer loads, an asmdef change — is reported by this job as a green tick over
      # zero tests. The exit code cannot tell "512 passed" from "none ran".
      #
      # The floor is 357, the count measured at 4ab204f by the command above. It is a
      # floor and not an equality on purpose: adding tests must never turn the build
      # red, and *losing* several hundred is the failure this exists to catch. Deleting
      # tests deliberately means lowering this number in the same commit — which is the
      # conversation the repo wants (docs/BALANCE-FINDINGS.md's rule that a fix has to
      # fail the build once, so the write-up moves with the change).
      #
      # THAT CONVERSATION DID NOT HAPPEN, and this is what it cost. e8c67ae deleted the
      # co-operative game and the ~155 tests that drove it — a legitimate deletion, and
      # nobody moved the floor with it. So this required job failed on arithmetic about
      # a game that no longer existed, on every push, for nine days and ~45 commits,
      # while the suite underneath it was green the entire time. A gate nobody can fix
      # is a gate everybody learns to scroll past, which is the argument docs/CI.md §2.2
      # makes against gating on exit 6 — and it applied here first.
      #
      # The lesson is not "pick a lower number". It is that a count in a gate is a claim
      # with a date on it, and the date is the part that rots.
      - name: Assert the suite actually ran
        run: |
          floor=357
          trx=artifacts/test-results/core-tests.trx
          if [ ! -f "${trx}" ]; then
            echo "::error::dotnet test wrote no TRX at ${trx}. The run cannot be audited, so it does not count as green."
            exit 1
          fi
          counters=$(grep -o '<Counters [^/]*/>' "${trx}" | head -1)
          passed=$(printf '%s' "${counters}" | sed -n 's/.*[^a-zA-Z]passed="\([0-9]*\)".*/\1/p')
          total=$(printf '%s' "${counters}" | sed -n 's/.*[^a-zA-Z]total="\([0-9]*\)".*/\1/p')
          echo "TRX counters: ${counters}"
          if [ -z "${passed}" ]; then
            echo "::error::Could not read a passed= count out of ${trx}. Not calling an unreadable result green."
            exit 1
          fi
          if [ "${passed}" -lt "${floor}" ]; then
            echo "::error::${passed} tests passed (total ${total}); the floor is ${floor}. Tests were lost, not fixed — check discovery before you lower this number."
            exit 1
          fi
          echo "${passed} passed, floor ${floor}."

      # The test project does not reference HorrorGame.Sim, so the balance simulator
      # (§16-2's loot-value question) can stop compiling without a single test
      # failing. Building the solution costs a couple of seconds and closes that gap.
      #
      # This is the step that was red on a89cf64, af2563d and 43cf488 — three commits
      # pushed to origin/main, one of them titled "the suite is green". ChamberDockProbe.cs
      # landed in Editor/SceneGen doing `using UnityEditor`, HorrorGame.Sim.csproj globs
      # that folder, and the Sim project stopped compiling. Note that `dotnet test` above
      # stayed green throughout, so the failing check was named "core tests (dotnet)"
      # while the tests were fine. docs/CI.md §0 has the whole account.
      - name: dotnet build (whole solution, Release)
        run: dotnet build core/HorrorGame.sln --configuration Release

      # Building the simulator does not prove it runs.
      #
      # THE DAY IT WAS DEAD: on 2026-08-03, at a3e268e, `dotnet build core/HorrorGame.sln
      # --configuration Release` reported "경고 0개 / 오류 0개" and this command aborted
      # with exit 134 on its first line of real work —
      #   System.InvalidOperationException: The map has 8 storeys and only 5 signs are
      #   written here (SimMap.SignTheStoreys)
      # — because the descent pivot grew the tower to eight storeys and SimMap's sign
      # table stayed at five. The simulator is the only tool that answers §16-2 and
      # docs/BALANCE-FINDINGS.md F-006, and CI had been calling it verified for a day
      # by compiling it. Exactly the B-006 lesson one layer out: B-006 was "the tool
      # does not build and the tests do not notice"; this is "the tool builds and
      # nothing runs it".
      #
      # `validate` is the right smoke command rather than a match run: it is seconds,
      # it is deterministic, and it exits non-zero — 5 map-does-not-build, 6 §12
      # rejects the map, 4 §03's clue chain does not converge — instead of printing a
      # verdict and returning 0. It also drags MapValidator over the shipped building
      # on every push, which is the first time §12's checklist has been enforced
      # anywhere outside the Unity editor.
      #
      # THE ONE EXIT CODE THAT IS NOT A FAILURE, AND WHY IT IS HANDLED HERE RATHER
      # THAN IGNORED. Exit 6 means MapValidator rejects the shipped map, and this
      # project *knowingly* ships a map that does — docs/BLOCKERS.md B-007, waived,
      # with the fix filed as docs/BALANCE-FINDINGS.md F-007. Gating hard on 6 would
      # put this check red on the day it is added and keep it red until a level
      # decision lands, which docs/CI.md §2.2 already argues at length is not a gate
      # at all: people learn to ignore it and the next real regression ships behind
      # the same red X. Ignoring the exit code outright is the other bad answer, and
      # docs/ARCHITECTURE.md §6 forbids it — a finding gets encoded and pinned, never
      # quietly dropped.
      #
      # So this is the audio gate's arrangement (tools/ci/check_audio_baseline.py)
      # applied to the map: the waiver is by RULE ID, not by exit code. A failure
      # confined to the waived rules is KNOWN and passes; a rule outside the list is
      # the regression this exists to catch and fails; and when nothing fails at all,
      # the step says so and asks for the waiver to be deleted. Every other non-zero
      # exit — a crash, 4, 5 — is the simulator being dead, which is the whole reason
      # the step exists, and fails hard.
      # WHAT HAPPENED TO THIS STEP. It used to run `dotnet run --project
      # core/HorrorGame.Sim -- validate`, and the balance simulator was deleted with the
      # co-op game at e8c67ae — 0 tracked files, gone from the .sln. So the REQUIRED job
      # was failing on every push for six days and 37 commits, on a command that can
      # never succeed again. That is worse than the defect the step was written to catch:
      # a red X nobody can fix teaches people to stop reading it, which is exactly the
      # argument docs/CI.md §2.2 makes against gating on exit 6.
      #
      # The step's real subject — "run §12's validator, do not merely build it, and fail
      # on a rule OUTSIDE the waiver" — survived the deletion, because MapValidator did.
      # It is now enforced by name in the core suite, so this step runs those tests and
      # nothing else: Descent_EveryOtherSection12Rule_StillPasses walks the passing rules
      # by name, Descent_MeetsSection12sSightBreakSpacing pins B-007's closure at 12.5 m,
      # Descent_CentrePath_... pins B-019's exact remaining miss (21 of 22 entry points,
      # one 2.5 m short) so that a slide back is a failure rather than a smaller green,
      # and Descent_IsDeterministic_... holds B-018.
      #
      # The filter must match something. A `--filter` that selects zero tests exits 0 in
      # older SDKs and reports "No test matches", which would make this step green by
      # describing nothing — the same vacuum the deleted project left. The count is
      # asserted below for that reason.
      - name: Run §12's map validator (not just build it)
        run: |
          mkdir -p artifacts
          log=artifacts/map-validate.log
          set +e
          dotnet test core/HorrorGame.Core.Tests/HorrorGame.Core.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~MapTests.Descent_" 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e

          ran=$(sed -n 's/.*전체: *\([0-9][0-9]*\).*/\1/p;s/.*Total: *\([0-9][0-9]*\).*/\1/p' "${log}" | tail -1)
          if [ -z "${ran}" ] || [ "${ran}" -lt 4 ]; then
            echo "::error title=§12 gate selected nothing::The map filter matched ${ran:-0} test(s), fewer than the four that own §12's rules. A filter that selects nothing passes while checking nothing — which is how the deleted simulator went unnoticed for 37 commits. Fix the filter or the test names."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "::error::§12's map validator rejects the shipped map on a rule these tests hold. Read ${log}: Descent_CentrePath_ failing means B-019 moved (it pins 21 of 22 entry points and the last 2.5 m), Descent_MeetsSection12sSightBreakSpacing failing means B-007 reopened, and Descent_EveryOtherSection12Rule_StillPasses names the rule that broke."
            exit "${status}"
          fi

          echo "§12 map validator: ${ran} test(s), all passing. B-007 closed, B-019 pinned at its measured miss."

      # Under always() because the run that most needs reading is the failed one, and
      # the console tail of a 357-test failure is not enough to work from. The
      # §12 map gate's transcript rides along: the map tests print the rule ids and the
      # measured spans that say *which* building was judged.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: |
            artifacts/test-results
            artifacts/map-validate.log
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────────
  # §12's five-material alphabet. See tools/ci/check_audio_baseline.py for why a
  # known blocking defect (F-002) is baselined rather than failing or ignored.
  # ───────────────────────────────────────────────────────────────────────────────
  asset-audit:
    name: asset audit (§12 audio)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the newest interpreter with wheels for the numpy and scipy
          # versions in tools/ci/requirements-audio.txt. On a newer interpreter pip
          # falls back to building scipy from source, which needs a Fortran compiler
          # and turns a 40-second job into a 20-minute one before failing.
          python-version: "3.12"

      - name: Cache the audio venv
        uses: actions/cache@v4
        with:
          path: tools/audio/.venv
          key: audio-venv-${{ runner.os }}-py3.12-${{ hashFiles('tools/ci/requirements-audio.txt') }}

      - name: Audit and gate
        run: tools/ci/verify_audio.sh --json audit.json

      # Attached whether the gate passed or failed: the full 5x5 separation matrix
      # and the per-clip measurements are what a retune actually needs to look at,
      # and they are far too long to read in a log.
      - name: Upload the audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-audit
          path: audit.json
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────────
  # Proof that the model generators still run. The .fbx/.glb files are committed
  # (docs/ASSETS.md), so nothing else would notice if the only way to regenerate
  # them stopped working.
  # ───────────────────────────────────────────────────────────────────────────────
  blender-generators:
    name: blender generators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # One place. tools/ci/install_blender_linux.sh reads this and pins a matching
      # sha256; bumping the version without the digest fails loudly rather than
      # installing something unverified.
      BLENDER_VERSION: "5.2.0"
    steps:
      - uses: actions/checkout@v4

      # Keyed on the version alone: the tarball for a given version never changes,
      # and tools/ci/install_blender_linux.sh verifies its sha256 either way.
      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: ~/.cache/blender
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}

      - name: Install Blender
        run: |
          BLENDER="$(tools/ci/install_blender_linux.sh)"
          echo "BLENDER=${BLENDER}" >> "$GITHUB_ENV"

      # Exits non-zero on ASSET_FAILED, on a Python traceback, or when a generator
      # writes nothing — because --background exits 0 after a Python exception and
      # the exit code alone would call a dead generator a success.
      - name: Regenerate every asset
        run: tools/ci/run_blender_generators.sh

      - name: Upload the generator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-logs
          path: artifacts/blender/*.log
          if-no-files-found: warn
